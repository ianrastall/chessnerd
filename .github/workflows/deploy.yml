name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Redeploy after a daily data-refresh workflow commits new data. The bot's
  # commit can't trigger a `push` run (GitHub blocks that), so we chain off the
  # data workflows' completion instead — the sanctioned pattern.
  workflow_run:
    workflows:
      - "Update Stockfish Commit Data"
      - "Update Chess Engine Data"
      - "Sync Titled Players Data"
      - "Sync FIDE Ratings Data"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync CCC archive metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:ccc
      - name: Sync Titled Tuesday archive metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:tt
      - name: Sync Bullet Brawl archive metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:bb
      - name: Sync 3-0 Thursday archive metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:t30
      - name: Sync Chess.com events archive metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:events
      # Report only: an advisory in a build-time dependency shouldn't hold up a deploy.
      - name: Audit dependencies
        continue-on-error: true
        run: npm run audit
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: npm run test:browser
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
